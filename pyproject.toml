[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudops-ai"
version = "0.1.0"
description = "Read-only GCP inspection and evidence-backed Cloud Run triage"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
cloudops = "cloudops_agent.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["cloudops_agent*"]

[tool.setuptools.package-data]
cloudops_agent = ["fixtures/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
